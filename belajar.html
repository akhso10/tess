<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Selamat! Lulus Belajar Coding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #0e1530;
      --primary: #66e344;
      --accent: #4f4789;
      --pink: #e847a8;
      --glow: rgba(102, 227, 255, 0.35);
      --card: rgba(255, 255, 255, 0.05);
      --grid: rgba(102, 227, 255, 0.2);
      --text: #e94744;
      --muted: #87b566;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    
    * {
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      margin: 0;
      background: 
        radial-gradient(1200px 800px at 80% -20%, transparent 60%),
        radial-gradient(1000px 800px at -10% 110%, transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: Poppins, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      mix-blend-mode: screen;
      background: 
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px, 40px 40px;
      animation: pan 30s linear infinite;
    }
    
    @keyframes pan {
      to {
        background-position: 1000px 0, 0 1000px;
      }
    }
    
    .circuit {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      filter: drop-shadow(0 0 8px rgba(102, 227, 255, 0.5));
    }
    
    #matrix {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .25;
    }
    
    .wrap {
      position: relative;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    
    .card {
      width: min(940px, 92vw);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow), 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
    }
    
    .glow-ring {
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      padding: 2px;
      background: conic-gradient(from 0deg, var(--primary), var(--accent), var(--pink), var(--primary));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spin 8s linear infinite;
      opacity: .35;
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    header {
      padding: 32px 28px 0;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .badge {
      font: 600 12px/1 "Fira Code", monospace;
      letter-spacing: .3px;
      text-transform: uppercase;
      color: #021014;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      padding: 8px 12px;
      border-radius: 999px;
      box-shadow: 0 6px 20px var(--glow);
    }
    
    .title {
      margin: 8px 0 0;
      padding: 0 28px;
      font-weight: 800;
      font-size: clamp(28px, 5vw, 48px);
      text-shadow: 0 1px 0 rgba(0,0,0,.3);
    }
    
    .subtitle {
      margin: 12px 28px 0;
      color: var(--muted);
      font-size: clamp(14px, 2.2vw, 18px);
    }
    
    .code {
      margin: 24px;
      background: #0a1328;
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      color: #c36744;
      position: relative;
      overflow: hidden;
    }
    
    .dots {
      position: absolute;
      top: 10px;
      left: 12px;
      display: flex;
      gap: 8px;
    }
    
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #445433;
      box-shadow: 16px 0 0 #440624, 32px 0 0 #276984;
      opacity: .8;
    }
    
    .btns {
      display: flex;
      gap: 12px;
      padding: 0 28px 28px;
      flex-wrap: wrap;
    }
    
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 14px;
      padding: 12px 16px;
      font: 600 14px Poppins, sans-serif;
      color: var(--text);
      background: #0f1c3d;
      box-shadow: 0 10px 30px rgba(0,0,0,.25), 0 0 0 1px rgba(255, 255, 255, 0.1);
      transition: transform .12s ease, box-shadow .2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(0,0,0,.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    
    button.primary {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: #021014;
    }
    
    .footer {
      padding: 0 28px 28px;
      color: var(--muted);
      font-size: 12px;
    }
    
    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 14px;
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }
  </style>
</head>

<body>
  <canvas id="matrix"></canvas>
  <div class="grid"></div>
  
  <svg class="circuit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="none">
    <defs>
      <linearGradient id="g" x1="0" x2="1">
        <stop offset="0%" stop-color="#66e3ff" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#47ffa5" stop-opacity=".5"/>
      </linearGradient>
    </defs>
    
    <g stroke="url(#g)" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M50 80 h120 v140 h60 v220 h70"/>
      <circle cx="300" cy="440" r="6"/>
      <path d="M220 140 v90 h120 v60 h90 v170"/>
      <circle cx="520" cy="290" r="5"/>
      <path d="M520 290 h140 v-80 h160 v200 h90"/>
      <circle cx="860" cy="410" r="5"/>
      <path d="M1000 120 v160 h-120 v220 h-160 v90"/>
    </g>
  </svg>
  
  <div class="wrap">
    <div class="card">
      <div class="glow-ring"></div>
      
      <header>
        <span class="badge">Achievement Unlocked - Coder</span>
      </header>
      
      <h1 class="title" id="judul">Selamat, <span id="nama">Teman Hebat</span>!</h1>
      <p class="subtitle">
        Kamu resmi menaklukkan dasar-dasar <strong>coding</strong>. Dari error pertama sampai program pertama yang berhasil jalan - semua terbayar!
      </p>
      
      <pre class="code">
        <div class="dots">
          <span class="dot"></span>
        </div>
        <code id="snippet"></code>
      </pre>
      
      <div class="btns">
        <button class="primary" id="btnConfetti">Lempar Konfeti 🎉</button>
        <button id="btnGantiNama">Ganti Nama Teman ✏️</button>
        <button id="btnSalin">Salin Ucapan 📋</button>
      </div>
      
      <div class="footer">
        Tip: Kamu bisa edit teks ucapan di kode, atau klik "Ganti Nama Teman". Latar: grid neon + circuit + efek "matrix rain".
      </div>
    </div>
  </div>
  
  <script>
    let dimas = "Teman Hebat";
    const snippet = `// Selamat datang di dunia coding!
const friend = "${dimas}";
console.log('Hai, ${dimas}! 🎉');

/* Pesan untukmu:
- Terus penasaran & jangan takut error
- Baca dokumentasi, coba-coba, ulangi
- Kode yang bagus lahir dari kebiasaan kecil
*/

function nextJourney() {
  return ["HTML", "CSS", "JavaScript", "Git", "Framework", "Project seru"];
}

// Proud of you. Keep building! ■`;
    
    const codeEl = document.getElementById('snippet');
    let i = 0;
    
    function type() {
      if (i <= snippet.length) {
        codeEl.textContent = snippet.slice(0, i++);
        requestAnimationFrame(type);
      }
    }
    
    type();
    
    document.getElementById('btnConfetti').addEventListener('click', throwConfetti);
    
    function throwConfetti() {
      const colors = ['#66e3ff', '#47ffa5', '#fff3d2'];
      for (let j = 0; j < 80; j++) {
        const d = document.createElement('div');
        d.className = 'confetti';
        d.style.left = Math.random() * 100 + 'vw';
        d.style.background = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(d);
        
        d.animate([
          { transform: 'translateY(0) rotate(0)', opacity: 1 },
          { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
        ], {
          duration: 3000 + Math.random() * 2000,
          iterations: 1
        });
        
        setTimeout(() => d.remove(), 5000);
      }
    }
    
    document.getElementById('btnGantiNama').addEventListener('click', () => {
      const baru = prompt('Masukkan nama temanmu:', dimas);
      if (baru) {
        dimas = baru;
        document.getElementById('nama').textContent = dimas;
      }
    });
    
    document.getElementById('btnSalin').addEventListener('click', async () => {
      const teks = `Selamat, ${dimas}! 🎉\nKamu berhasil belajar coding, jangan berhenti berkarya!`;
      await navigator.clipboard.writeText(teks);
      alert("Ucapan disalin!");
    });
    
    // Matrix Rain
    const cvs = document.getElementById("matrix");
    const ctx = cvs.getContext("2d");
    let fontSize = 16;
    let cols, drops;
    
    function resize() {
      cvs.width = innerWidth;
      cvs.height = innerHeight;
      cols = Math.floor(cvs.width / fontSize);
      drops = Array(cols).fill(1);
    }
    
    window.addEventListener("resize", resize);
    resize();
    
    const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ()[]<>#$%&*+=-".split("");
    
    function draw() {
      ctx.fillStyle = "rgba(11,16,32,0.08)";
      ctx.fillRect(0, 0, cvs.width, cvs.height);
      ctx.font = fontSize + "px Fira Code";
      
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillStyle = Math.random() > .5 ? "#66e3ff" : "#47ffa5";
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        
        if (drops[i] * fontSize > cvs.height && Math.random() > .975) {
          drops[i] = 0;
        }
        
        drops[i]++;
      }
      
      requestAnimationFrame(draw);
    }
    
    draw();
    setTimeout(throwConfetti, 800);
  </script>
</body>
</html>
